<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 污泥回流</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a aria-current="page" href="/sludge">污泥回流</a><a href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>污泥回流与排空</h1><div class="muted">主备泵交接、流量确认和阀路互斥</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid"><section class="panel wide"><h2>回流泵</h2><table><thead><tr><th>设备</th><th>处理线</th><th>运行</th><th>流量</th></tr></thead><tbody id="pumps"></tbody></table></section><section class="panel"><h2>主备交接</h2><form id="handover"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>退出泵<input name="from" value="pump-line-1-A"></label><label>接管泵<input name="to" value="pump-line-1-B"></label><button>开始交接</button></form></section><section class="panel"><h2>二沉池排空</h2><form id="drain"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>池号<input name="basin" value="SD1"></label><button>申请排空阀路</button></form></section><section class="panel"><h2>回流序列故障</h2><form id="sequence"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>回流泵<input name="pump" value="pump-line-1-A"></label><label>排泥序号<input name="number" type="number" value="1" min="1"></label><button type="submit" name="op" value="start">开始序列</button><button type="submit" class="danger" name="op" value="fail">上报泵故障</button></form></section><section class="panel wide"><h2>停泵补偿任务</h2><table><thead><tr><th>处理线</th><th>设备</th><th>动作</th><th>状态</th><th>执行次数</th><th>下次重试</th><th>失败原因</th></tr></thead><tbody id="compensations"></tbody></table></section><section class="panel wide"><h2>操作结果</h2><pre id="output">等待操作</pre></section></div></main>
<script src="/assets/common.js"></script><script>
const STATUS_TEXT={pending:'待执行/重试',manual_review:'待人工复核',failed:'重试已放弃'};
function fmtTime(t){return t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'-';}
async function load(){
  const d=await request('/api/sludge');
  document.querySelector('#pumps').innerHTML=d.pumps.map(p=>`<tr><td>${p.id}</td><td>${p.line_id}</td><td>${p.running?'运行':'停止'}</td><td>${p.flow}</td></tr>`).join('');
  const rows=d.compensations||[];
  document.querySelector('#compensations').innerHTML=rows.length?rows.map(c=>`<tr><td>${c.line_id}</td><td>${c.device_id}</td><td>${c.action==='stop'?'延迟停泵':c.action}</td><td>${STATUS_TEXT[c.status]||c.status}</td><td>${c.attempts}/${c.max_attempts}</td><td>${c.status==='pending'?fmtTime(c.due_at):'-'}</td><td>${c.last_error?escapeHtml(c.last_error):'-'}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">无待处理补偿任务</td></tr>';
}
function escapeHtml(s){return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
document.querySelector('#handover').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/sludge/${f.get('line')}/handover`,{method:'POST',body:JSON.stringify({from_pump:f.get('from'),to_pump:f.get('to')})}))}catch(err){showError(err)}});
document.querySelector('#drain').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/sludge/${f.get('line')}/drain/${f.get('basin')}`,{method:'POST',body:'{}'}))}catch(err){showError(err)}});
document.querySelector('#sequence').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const line=f.get('line');try{
  if(f.get('op')==='start'){show(await request(`/api/sludge/${line}/sequences`,{method:'POST',body:JSON.stringify({pump_id:f.get('pump'),number:Number(f.get('number'))})}));}
  else{show(await request(`/api/sludge/${line}/sequences/fail`,{method:'POST',body:'{}'}));}
  load();
}catch(err){showError(err)}});
load().catch(showError);setInterval(()=>load().catch(()=>{}),2000);
</script></body></html>
